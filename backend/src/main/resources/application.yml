spring:
  application:
    name: notification-management-service

  # Demo/dev default: file-based SQLite so data survives an app restart (H2's in-memory
  # default did not). This is explicitly a demo-purposes choice, not a production one — see
  # docs/architecture-overview.md §2 and application-postgres.yml for the production path.
  # foreign_keys=on because SQLite disables FK enforcement (and therefore ON DELETE CASCADE)
  # per-connection by default.
  datasource:
    url: jdbc:sqlite:${nms.sqlite.file:./data/nms.db}?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    # SQLite's dynamic typing means the JDBC driver reports column metadata loosely (e.g.
    # UUID/TIMESTAMP/BOOLEAN columns all come back with approximate affinities), which trips
    # Hibernate's schema validator with false-positive mismatches even though the schema
    # (owned by Flyway, see db/migration) is correct and the app works. Validation stays
    # strict on the H2 test profile and the Postgres prod profile; here it's a deliberate,
    # documented gap, not an oversight.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

nms:
  worker:
    poll-interval-ms: 2000
  retry:
    base-delay-seconds: 30
    max-delay-seconds: 900
  idempotency:
    cleanup-interval-ms: 3600000
  escalation:
    poll-interval-ms: 30000
    unacknowledged-critical-threshold-minutes: 15
    escalation-recipient-id: oncall-escalation-group
    escalation-channel: SLACK

logging:
  level:
    com.schwab.nms: INFO
