# Production-shaped profile: run with SPRING_PROFILES_ACTIVE=postgres
# and provide DB credentials via environment variables (never commit real secrets).
spring:
  datasource:
    url: ${NMS_DB_URL:jdbc:postgresql://localhost:5432/nms}
    driver-class-name: org.postgresql.Driver
    username: ${NMS_DB_USERNAME:nms_app}
    password: ${NMS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  h2:
    console:
      enabled: false
