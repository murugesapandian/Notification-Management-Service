spring:
  datasource:
    url: jdbc:h2:mem:nms-test-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

nms:
  worker:
    poll-interval-ms: 200
  retry:
    base-delay-seconds: 1
    max-delay-seconds: 5
  escalation:
    poll-interval-ms: 500
    unacknowledged-critical-threshold-minutes: 15
    escalation-recipient-id: oncall-escalation-group
    escalation-channel: SLACK

logging:
  level:
    com.schwab.nms: DEBUG
